# The C6b trap-stream recorder shim (DEC-48 rulings 1+3). Standalone: the empty
# [workspace] table keeps it OUT of the main jka-rust workspace so building it
# never drags the whole client tree in, and vice versa.
[package]
name = "cgame-shim"
version = "0.1.0"
edition = "2021"
publish = false

# cdylib: the loadable module openjk.app dlopens as the cgame module (staged as
# cgamearm64.dylib). lib: lets the interpose test call dllEntry/vmMain directly
# and link the cc-built C trampoline into the test binary.
[lib]
name = "cgamearm64"
crate-type = ["cdylib", "lib"]

[dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1"
cc = "1"

# out-of-workspace: own lockfile, own target dir under this folder.
[workspace]
