name: Build modules

# Builds the MP server game module (`jampgame`) as a shared library for every
# arch the engine loads, in BOTH the release and debug profiles, and packages
# each as a zip. Adapted from the oracle port's proven pipeline
# (oracle/.github/workflows/build.yml).
#
# The file *inside* each zip keeps the exact arch-suffixed name the engine
# expects at load time (`"jampgame" ARCH_STRING DLL_EXT`; the engine refuses to
# load a renamed module). Profile/arch live in the zip name, never in the
# module filename:
#
#   Windows 32-bit  x86      jampgamex86.dll
#   Windows 64-bit  x86_64   jampgamex86_64.dll
#   Linux   32-bit  i386     jampgamei386.so
#   Linux   64-bit  x86_64   jampgamex86_64.so
#
# All lanes are enforced: the ILP32 assert pass (2026-07-13) gave every
# pointer-width-dependent layout assert in jampgame's crate tree a
# cfg(target_pointer_width = "32") twin whose values are clang i386 ground
# truth (i386-pc-windows-msvc and i386-pc-linux-gnu agree) — the retail
# modules are 32-bit, so these are the shipping-ABI numbers. Debug builds are
# a real link gate — the cdylib's release link catches undefined symbols a
# local debug `cargo build` tolerates on Linux/macOS.
#
# Zip names are STABLE (no version segment) so the rolling `latest` release
# keeps stable download URLs; the built commit is recorded in the release body.
#
# The build matrix is gated behind the jampgame-lane compile + test run
# (temporarily scoped down from full-workspace; see the gate step note). The
# compile is this repo's layout bar (every ABI struct carries size/offset
# static-asserts), and the test run carries the oracle differential parity
# suites (pmove/bglib/qmath/saberload goldens under crates/mp/game/tests/).
# Tests run single-threaded: the oracle harness convention assumes it (shared
# global RNG seed).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # the release job attaches assets to the rolling release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workspace compile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: test-cargo-

      - name: workspace build (layout asserts are compile-time)
        run: cargo build --workspace

      - name: workspace tests incl. oracle parity suites (single-threaded)
        run: cargo test --workspace -- --test-threads=1

      - name: Install i686 target + multilib (engine ILP32 gate)
        run: |
          rustup target add i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      # The engine-island ILP32 layout-assert gate (2026-07-12): every
      # pointer-width-dependent assert in mp_app's crate tree carries a
      # cfg(target_pointer_width = "32") twin with clang i386 ground truth.
      # `check` (not `build`): the i686 *link* is still blocked on the vm_x86
      # QVM-JIT asm statics (callMask/callAsmCall homes — tracked PORT-NOTE),
      # which the allowed-failure server lane below exercises.
      - name: i686 layout-assert cross-check (engine island)
        run: cargo check -p mp_app --target i686-unknown-linux-gnu

  build:
    name: ${{ matrix.target.module }} (${{ matrix.profile }})
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.target.runner }}
    continue-on-error: ${{ matrix.target.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
        target:
          - module: jampgamex86.dll
            runner: windows-latest
            triple: i686-pc-windows-msvc
            cargo_artifact: jampgame.dll
            arch: x86
            platform: windows
            allow_failure: false
          - module: jampgamex86_64.dll
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            cargo_artifact: jampgame.dll
            arch: x86_64
            platform: windows
            allow_failure: false
          - module: jampgamei386.so
            runner: ubuntu-latest
            triple: i686-unknown-linux-gnu
            cargo_artifact: libjampgame.so
            arch: i386
            platform: linux
            allow_failure: false
          - module: jampgamex86_64.so
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            cargo_artifact: libjampgame.so
            arch: x86_64
            platform: linux
            allow_failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Install 32-bit Linux cross deps
        if: matrix.target.triple == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target.triple }}-${{ matrix.profile }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.target.triple }}-${{ matrix.profile }}-cargo-

      - name: Build (${{ matrix.profile }} cdylib)
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo build -p jampgame --release --target ${{ matrix.target.triple }}
            echo "PROFILE_DIR=release" >> "$GITHUB_ENV"
          else
            cargo build -p jampgame --target ${{ matrix.target.triple }}
            echo "PROFILE_DIR=debug" >> "$GITHUB_ENV"
          fi

      - name: Package zip
        shell: bash
        run: |
          src="target/${{ matrix.target.triple }}/${PROFILE_DIR}/${{ matrix.target.cargo_artifact }}"
          test -f "$src" || { echo "::error::built module not found at $src"; exit 1; }
          zip_name="jampgame-${{ matrix.target.arch }}-${{ matrix.target.platform }}-${{ matrix.profile }}.zip"
          rm -rf package dist
          mkdir -p package dist
          # rename to the engine-required load name *inside* the archive
          cp "$src" "package/${{ matrix.target.module }}"
          ( cd package && 7z a -tzip tmp.zip "${{ matrix.target.module }}" >/dev/null )
          mv package/tmp.zip "dist/${zip_name}"
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  server:
    name: jampded ${{ matrix.target.artifact_suffix }} (${{ matrix.profile }})
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.target.runner }}
    continue-on-error: ${{ matrix.target.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
        target:
          # The dedicated-server EXECUTABLE (mp_app, the jampded equivalent).
          # Unix lanes only: the engine island ports Raven's unix/ platform
          # tree (the win32 twin is unported, native_platform gates it
          # cfg(unix)). All lanes enforced: the engine-island ILP32 assert
          # pass (2026-07-12) covers the i386 lane, and its first run linked
          # green in both profiles (the un-referenced vm_x86 QVM-JIT asm is
          # GC'd at link; its callMask/callAsmCall homes remain a tracked
          # PORT-NOTE for when the JIT path goes live).
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            artifact_suffix: x86_64-linux
            allow_failure: false
          - runner: macos-latest
            triple: aarch64-apple-darwin
            artifact_suffix: arm64-macos
            allow_failure: false
          - runner: ubuntu-latest
            triple: i686-unknown-linux-gnu
            artifact_suffix: i386-linux
            allow_failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Install 32-bit Linux cross deps
        if: matrix.target.triple == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target.triple }}-server-${{ matrix.profile }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.target.triple }}-server-${{ matrix.profile }}-cargo-

      - name: Build (${{ matrix.profile }} executable)
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo build -p mp_app --release --target ${{ matrix.target.triple }}
            echo "PROFILE_DIR=release" >> "$GITHUB_ENV"
          else
            cargo build -p mp_app --target ${{ matrix.target.triple }}
            echo "PROFILE_DIR=debug" >> "$GITHUB_ENV"
          fi

      - name: Package zip
        shell: bash
        run: |
          src="target/${{ matrix.target.triple }}/${PROFILE_DIR}/mp_app"
          test -f "$src" || { echo "::error::built server not found at $src"; exit 1; }
          zip_name="jampded-${{ matrix.target.artifact_suffix }}-${{ matrix.profile }}.zip"
          rm -rf package dist
          mkdir -p package dist
          # ship under the Raven-equivalent binary name
          cp "$src" "package/jampded"
          chmod +x package/jampded
          ( cd package && 7z a -tzip tmp.zip jampded >/dev/null )
          mv package/tmp.zip "dist/${zip_name}"
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    name: Update rolling release
    needs: [build, server]
    # Master-only (see `build`'s `if`).
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List collected zips
        run: ls -lR dist

      - name: Publish rolling `latest` release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Rolling build (master)
          prerelease: true
          body: |
            Automated build of `master` @ ${{ github.sha }}.

            Each module zip contains the file under the exact name the engine
            loads (`jampgamex86_64.dll`, `jampgamex86_64.so`, …); the
            `jampded-*` zips carry the pure-Rust dedicated-server executable
            (linux x86_64/i386, macos arm64). Asset URLs are stable across
            builds.
          files: dist/*.zip
          fail_on_unmatched_files: false
