name: Build modules

# This workflow builds the three MP modules (`jampgame`, `cgame`, `ui`) as release shared libraries for every arch the engine loads.
# It packages each module as a zip.
# The pipeline comes from the oracle port (oracle/.github/workflows/build.yml).
#
# The file inside each zip keeps the exact arch-suffixed name the engine expects at load time (`"<module>" ARCH_STRING DLL_EXT`).
# The engine refuses to load a renamed module.
# The profile and the arch live in the zip name, never in the module filename:
#
#   Windows 32-bit  x86      jampgamex86.dll     cgamex86.dll     uix86.dll
#   Windows 64-bit  x86_64   jampgamex86_64.dll  cgamex86_64.dll  uix86_64.dll
#   Linux   32-bit  i386     jampgamei386.so     cgamei386.so     uii386.so
#   Linux   64-bit  x86_64   jampgamex86_64.so   cgamex86_64.so   uix86_64.so
#
# Every lane is enforced.
# The ILP32 assert pass (2026-07-13) gave every pointer-width-dependent layout assert in jampgame's crate tree a cfg(target_pointer_width = "32") twin.
# The twin values are clang i386 ground truth, and i386-pc-windows-msvc agrees with i386-pc-linux-gnu.
# The retail modules are 32-bit, so these are the shipping-ABI numbers.
# The release cdylib link is a real gate, because it catches undefined symbols that a local debug `cargo build` tolerates on Linux and macOS.
# The user ruling of 2026-08-07 dropped the module debug lanes.
# The `jampded` server job keeps both profiles.
#
# The zip names carry no version segment, so the rolling `latest` release keeps stable download URLs.
# The release body records the built commit.
#
# The `test` job gates the build matrix.
# The workspace build is this repo's layout bar, because every ABI struct carries size and offset static-asserts.
# The test run carries the oracle differential parity suites, the pmove, bglib, qmath, and saberload goldens under crates/mp/game/tests/.
# The tests run single-threaded, because the oracle harness convention assumes one shared global RNG seed.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # The release job attaches assets to the rolling release.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workspace compile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: test-cargo-

      # `mp_client_app` turns on the `sound_device` feature of `mp_engine_client`, so the workspace build reaches cpal.
      # The ALSA backend of cpal needs these headers.
      # The `jampded` lane never enables the feature and never needs this step.
      - name: Install the ALSA headers (cpal, DEC-57.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: workspace build (layout asserts are compile-time)
        run: cargo build --workspace

      - name: workspace tests incl. oracle parity suites (single-threaded)
        run: cargo test --workspace -- --test-threads=1

      - name: Install i686 target + multilib (engine ILP32 gate)
        run: |
          rustup target add i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      # This is the engine-island ILP32 layout-assert gate (2026-07-12).
      # Every pointer-width-dependent assert in the crate tree of mp_app carries a cfg(target_pointer_width = "32") twin with clang i386 ground truth.
      # The step runs `check` and not `build`, because the vm_x86 QVM-JIT asm statics (the callMask and callAsmCall homes, a tracked PORT-NOTE) block the i686 link.
      # The i386 server lane below exercises that link.
      - name: i686 layout-assert cross-check (engine island)
        run: cargo check -p mp_app --target i686-unknown-linux-gnu

  build:
    name: ${{ matrix.family.name }} ${{ matrix.target.arch }}-${{ matrix.target.platform }}
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.target.runner }}
    continue-on-error: ${{ matrix.target.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        # `name` is the engine load-name stem.
        # `package` is the cargo package, and `lib` is the cargo lib name that gives the artifact filename.
        family:
          - name: jampgame
            package: jampgame
            lib: jampgame
          - name: cgame
            package: mp_cgame
            lib: mp_cgame
          - name: ui
            package: mp_ui
            lib: mp_ui
        target:
          - runner: windows-latest
            triple: i686-pc-windows-msvc
            arch: x86
            platform: windows
            allow_failure: false
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            arch: x86_64
            platform: windows
            allow_failure: false
          - runner: ubuntu-latest
            triple: i686-unknown-linux-gnu
            arch: i386
            platform: linux
            allow_failure: false
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            arch: x86_64
            platform: linux
            allow_failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Install 32-bit Linux cross deps
        if: matrix.target.triple == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target.triple }}-${{ matrix.family.name }}-release-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.target.triple }}-${{ matrix.family.name }}-release-cargo-

      - name: Build (release cdylib)
        shell: bash
        run: cargo build -p ${{ matrix.family.package }} --release --target ${{ matrix.target.triple }}

      - name: Package zip
        shell: bash
        run: |
          if [ "${{ matrix.target.platform }}" = "windows" ]; then
            artifact="${{ matrix.family.lib }}.dll"
            ext="dll"
          else
            artifact="lib${{ matrix.family.lib }}.so"
            ext="so"
          fi
          module="${{ matrix.family.name }}${{ matrix.target.arch }}.${ext}"
          src="target/${{ matrix.target.triple }}/release/${artifact}"
          test -f "$src" || { echo "::error::built module not found at $src"; exit 1; }
          zip_name="${{ matrix.family.name }}-${{ matrix.target.arch }}-${{ matrix.target.platform }}-release.zip"
          rm -rf package dist
          mkdir -p package dist
          # Copy the artifact to the load name the engine requires inside the archive.
          cp "$src" "package/${module}"
          ( cd package && 7z a -tzip tmp.zip "${module}" >/dev/null )
          mv package/tmp.zip "dist/${zip_name}"
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  server:
    name: jampded ${{ matrix.target.artifact_suffix }} (${{ matrix.profile }})
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.target.runner }}
    continue-on-error: ${{ matrix.target.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        profile: [release, debug]
        target:
          # These lanes build the dedicated-server executable (mp_app, the jampded equivalent).
          # The lanes are Unix only, because the engine island ports Raven's unix/ platform tree.
          # The win32 twin is unported, and native_platform gates it with cfg(unix).
          # Every lane is enforced.
          # The engine-island ILP32 assert pass (2026-07-12) covers the i386 lane, and its first run linked green in both profiles.
          # The linker removes the un-referenced vm_x86 QVM-JIT asm.
          # The callMask and callAsmCall homes remain a tracked PORT-NOTE for when the JIT path goes live.
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            artifact_suffix: x86_64-linux
            allow_failure: false
          - runner: macos-latest
            triple: aarch64-apple-darwin
            artifact_suffix: arm64-macos
            allow_failure: false
          - runner: ubuntu-latest
            triple: i686-unknown-linux-gnu
            artifact_suffix: i386-linux
            allow_failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Install 32-bit Linux cross deps
        if: matrix.target.triple == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target.triple }}-server-${{ matrix.profile }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.target.triple }}-server-${{ matrix.profile }}-cargo-

      - name: Build (${{ matrix.profile }} executable)
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo build -p mp_app --release --target ${{ matrix.target.triple }}
            echo "PROFILE_DIR=release" >> "$GITHUB_ENV"
          else
            cargo build -p mp_app --target ${{ matrix.target.triple }}
            echo "PROFILE_DIR=debug" >> "$GITHUB_ENV"
          fi

      - name: Package zip
        shell: bash
        run: |
          src="target/${{ matrix.target.triple }}/${PROFILE_DIR}/mp_app"
          test -f "$src" || { echo "::error::built server not found at $src"; exit 1; }
          zip_name="jampded-${{ matrix.target.artifact_suffix }}-${{ matrix.profile }}.zip"
          rm -rf package dist
          mkdir -p package dist
          # Ship the executable under the Raven-equivalent binary name.
          cp "$src" "package/jampded"
          chmod +x package/jampded
          ( cd package && 7z a -tzip tmp.zip jampded >/dev/null )
          mv package/tmp.zip "dist/${zip_name}"
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    name: Update rolling release
    needs: [build, server]
    # This job runs on master only, the same as the `build` job.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List collected zips
        run: ls -lR dist

      # The publish step replaces assets by name and never removes one.
      # This step deletes every asset of the rolling release that the current build did not produce, so a dropped lane leaves no stale download.
      - name: Delete stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no rolling release yet, nothing to delete"
            exit 0
          fi
          for asset in $(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            if [ ! -f "dist/${asset}" ]; then
              echo "deleting stale asset: ${asset}"
              gh release delete-asset latest "${asset}" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Publish rolling `latest` release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Rolling build (master)
          prerelease: true
          body: |
            Automated build of `master` @ ${{ github.sha }}.

            Each module zip contains the file under the exact name the engine
            loads (`jampgamex86_64.dll`, `cgamex86_64.dll`, `uix86_64.so`, …).
            The `jampded-*` zips carry the pure-Rust dedicated-server
            executable (linux x86_64/i386, macos arm64). Asset URLs are stable
            across builds.
          files: dist/*.zip
          fail_on_unmatched_files: false
