[package]
name = "ui"
version = "0.1.0"
edition = "2021"
description = "MP UI module cdylib target, mirroring OpenJK's UI shared library."

[lib]
name = "ui"
crate-type = ["cdylib"]

[dependencies]
# SEAM-D10: the thin cdylib shell depends on abi_transport AND its logic crate.
abi_transport = { path = "../abi-transport" }
mp_ui = { path = "../mp/ui" }
# The placeholder DisplayContext implementor (`display_context_stub.rs`)
# names types straight from these two crates, same as `mp_ui` itself does.
mp_qshared = { path = "../mp/qshared" }
mp_uishared = { path = "../mp/uishared" }
