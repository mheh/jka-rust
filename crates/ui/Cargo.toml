[package]
name = "ui"
version = "0.1.0"
edition = "2021"
description = "MP UI module cdylib target, mirroring OpenJK's UI shared library."

[lib]
name = "ui"
crate-type = ["cdylib"]

[dependencies]
# SEAM-D10: the thin cdylib shell depends on abi_transport AND its logic crate.
abi_transport = { path = "../abi-transport" }
mp_ui = { path = "../mp/ui" }

[dev-dependencies]
# ABI smoke test (tests/abi_smoke.rs): drive the BUILT cdylib through the real
# engine contract, mirroring `crates/jampgame`'s. `mp_engine_qcommon` supplies
# the inbound C-variadic syscall trampoline + `arm_game_slot`; `native_platform`
# the libloading-based module loader; `mp_abi` the export wire numbers and
# `UI_API_VERSION`.
mp_engine_qcommon = { path = "../mp/engine/qcommon" }
native_platform = { path = "../native/platform" }
mp_abi = { path = "../mp/abi" }
