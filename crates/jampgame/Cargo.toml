[package]
name = "jampgame"
version = "0.1.0"
edition = "2021"
description = "MP game module cdylib target, mirroring OpenJK's jampgame shared library."

[lib]
name = "jampgame"
crate-type = ["cdylib"]

[dependencies]
# SEAM-D10: the thin cdylib shell depends on abi_transport AND its logic crate.
abi_transport = { path = "../abi-transport" }
mp_game = { path = "../mp/game" }

[dev-dependencies]
# ABI smoke test (tests/abi_smoke.rs): drive the BUILT cdylib through the real
# engine contract. `mp_engine_qcommon` supplies the inbound C-variadic syscall
# trampoline + `arm_game_slot`; `native_platform` the libloading-based module
# loader (its first live exercise); `mp_abi` the import/export wire numbers;
# `mp_qshared` the `vmCvar_t` layout the mock engine writes back.
mp_engine_qcommon = { path = "../mp/engine/qcommon" }
native_platform = { path = "../native/platform" }
mp_abi = { path = "../mp/abi" }
mp_qshared = { path = "../mp/qshared" }
# Referee swap (plan §3c): the real engine island backs the spatial/world
# syscall arms on real-map scenarios (`tests/referee.rs` hybrid mode). `Engine`
# + `engine_host_view` come from core; `SV_GameSystemCalls`/`SV_ClearWorld`/the
# server hook installer from server; `mp_renderer` only to call its hook
# installer directly (the mock owns the game slot, so we cannot use core's
# `install_engine_hooks`, which also arms it). All other engine subsystems
# (renderer/rmg/ghoul2/icarus/botlib) come transitively via `mp_engine_core`.
mp_engine_core = { path = "../mp/engine/core" }
mp_engine_server = { path = "../mp/engine/server" }
mp_renderer = { path = "../mp/renderer" }
