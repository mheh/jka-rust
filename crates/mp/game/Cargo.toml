[package]
name = "mp_game"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_game"
crate-type = ["cdylib", "rlib"]

[dependencies]
native_math = { path = "../../native/math" }
native_string = { path = "../../native/string" }
mp_qshared = { path = "../qshared" }
mp_bg = { path = "../bg" }
mp_abi = { path = "../abi" }
# SEAM-D13: the module-side transport alias (`mod trap`, GameContext.engine).
mp_engine_select = { path = "../engine-select" }
# STATE-D9: zeroed_box/ZeroValid for GameWorld construction (doc-sanctioned edge).
native_platform = { path = "../../native/platform" }

[dev-dependencies]
# Saberload parity test (tests/jampgame_parity.rs): the inbound C-variadic
# syscall trampoline + `arm_game_slot`, so the test's configstring-servicing
# mock engine can sit behind the real `CEngine` seam (the jampgame smoke-test
# precedent, crates/jampgame/tests/common/mod.rs).
mp_engine_qcommon = { path = "../engine/qcommon" }
