[package]
name = "mp_renderer"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_renderer"

[dependencies]
mp_qshared = { path = "../qshared" }
mp_engine_qcommon = { path = "../engine/qcommon" }
native_platform = { path = "../../native/platform" }
# tr_model's server_load/cached_model_binary methods take `host: &mut impl
# EngineHost`; EngineHost is frozen in mp_host_interface. Edge authorized by the
# ruling-56c blanket §F-consumer authorization (TRM-D1(c)) — acyclic since
# mp_host_interface deps only mp_qshared.
mp_host_interface = { path = "../host-interface" }
