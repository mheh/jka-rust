[package]
name = "mp_engine_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_engine_server"

[build-dependencies]
cc = "1"

[dependencies]
libc = "0.2"
mp_qshared = { path = "../../qshared" }
# bg_public constants/enums (entity_type, entity_flags, configstring, gametype)
# that Raven's server includes via bg_public.h; acyclic (bg is Tier 1, below the
# engine) — mirrors mp_engine_botlib's existing mp_bg dependency.
mp_bg = { path = "../../bg" }
mp_engine_qcommon = { path = "../qcommon" }
mp_abi = { path = "../../abi" }
# EngineHost trait seam consumed by the npcnav host-taking methods (NAV-D3 /
# RULING 11/24/36; path dep authorized by ruling 56c).
mp_host_interface = { path = "../../host-interface" }
native_math = { path = "../../../native/math" }
native_string = { path = "../../../native/string" }
native_types = { path = "../../../native/types" }
# Sys_CheckCD and friends — the leaf platform crate (unix_main.c home);
# acyclic (native_platform sits below the engine tier).
native_platform = { path = "../../../native/platform" }
mp_engine_botlib = { path = "../botlib" }
mp_engine_ghoul2 = { path = "../ghoul2" }
mp_engine_icarus = { path = "../icarus" }
mp_engine_rmg = { path = "../rmg" }
# Renderer package is `mp_renderer`; call sites across sv_*.rs were
# transcribed against a `mp_engine_renderer` path — alias rather than touch
# every call site.
mp_engine_renderer = { package = "mp_renderer", path = "../../renderer" }

[dev-dependencies]
testkit = { path = "../../../testkit" }
