[package]
name = "mp_engine_client"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_engine_client"

[dependencies]
libc = "0.2"
# The replaced MP3 decoder (DEC-03, DEC-57.3). Raven's `codemp/mp3code` C decoder
# does not port; `snd_mp3` keeps Raven's wrap logic and calls this crate for the
# granule decode. Pure Rust, the zune-jpeg posture of DEC-49.
symphonia-bundle-mp3 = { version = "0.6", default-features = false, features = ["mp3"] }
symphonia-core = { version = "0.6", default-features = false }
native_math = { path = "../../../native/math" }
native_platform = { path = "../../../native/platform" }
native_string = { path = "../../../native/string" }
native_types = { path = "../../../native/types" }
mp_qshared = { path = "../../qshared" }
mp_bg = { path = "../../bg" }
mp_engine_qcommon = { path = "../qcommon" }
mp_abi = { path = "../../abi" }
mp_host_interface = { path = "../../host-interface" }
# The client calls the ghoul2, ICARUS, and RMG subsystems directly, the same way
# the server does (`cl_cgame`'s G2 trap block, `S_COLOR_RED`, `RmManager`).
mp_engine_ghoul2 = { path = "../ghoul2" }
mp_engine_icarus = { path = "../icarus" }
mp_engine_rmg = { path = "../rmg" }
# `CL_Disconnect` and `CL_ShutdownAll` drive the listen server through `SV_Frame`
# and `SV_Shutdown`. The seven `PC_*` trap arms call the same `botlib_export`
# table the server owns, so the client names `BotLib` as its receiver too.
mp_engine_server = { path = "../server" }
mp_engine_botlib = { path = "../botlib" }
# `cl_scrn`/`cl_cgame` reach the renderer export table (`refexport_t`, `RenderModels`).
mp_renderer = { path = "../../renderer" }
# The client shares the module-side helpers that `mp_game` and `mp_ui` own
# (`Q_PrintStrlen`, the cvar-flag consts, `fakeAscii_t`, the server-status table).
mp_game = { path = "../../game" }
mp_ui = { path = "../../ui" }
# The DEC-57.1 device end. Raven picked the sound device at link time
# (`win_snd.cpp` for the client, `null_snddma.cpp` for the dedicated server);
# the `sound_device` feature is that same arm. The `-p mp_app` lanes (the
# `jampded` release build and the ILP32 cross-check) never enable it. A
# `--workspace` build does enable it everywhere, because cargo unifies features,
# but `device_enabled` stays false on dedicated so the arm is inert there anyway.
cpal = { version = "0.18.1", optional = true }

[features]
default = []
sound_device = ["dep:cpal"]
