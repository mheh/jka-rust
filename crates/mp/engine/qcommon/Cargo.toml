[package]
name = "mp_engine_qcommon"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_engine_qcommon"

[dependencies]
libc = "0.2"
# User ruling 2026-07-11: back minizip's raw-DEFLATE inflate with flate2's
# `Decompress` rather than porting zlib32's inflate (see src/unzip.rs).
flate2 = "1"
mp_qshared = { path = "../../qshared" }
abi_transport = { path = "../../../abi-transport" }
native_platform = { path = "../../../native/platform" }
native_math = { path = "../../../native/math" }
native_string = { path = "../../../native/string" }
native_types = { path = "../../../native/types" }
# The RMG terrain seams (`register_terrain`, `rmg_create_seed`, the ctor's
# empty-heightMap `Com_Error`) and cm_trace.rs's §F callees thread
# `&mut impl EngineHost` — the one Stage-0 host-services trait (RMG-D3,
# rulings 11/24/36; ruling 56c authorizes this edge).
mp_host_interface = { path = "../../host-interface" }

[build-dependencies]
# Builds the SEAM-D11 C-variadic trampoline shim (src/vm/game_syscall_trampoline.c);
# stable Rust cannot define a C-variadic fn (skeleton-findings resolution 1).
cc = "1"
native_build_date = { path = "../../../native/build-date" }

[dev-dependencies]
testkit = { path = "../../../testkit" }
