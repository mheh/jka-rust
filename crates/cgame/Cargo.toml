[package]
name = "cgame"
version = "0.1.0"
edition = "2021"
description = "MP cgame module cdylib target, mirroring OpenJK's cgame shared library."

[lib]
name = "cgame"
crate-type = ["cdylib"]

[dependencies]
# SEAM-D10: the thin cdylib shell depends on abi_transport AND its logic crate.
abi_transport = { path = "../abi-transport" }
mp_cgame = { path = "../mp/cgame" }

[dev-dependencies]
# ABI smoke test (tests/abi_smoke.rs): drive the BUILT cdylib through the real
# engine contract, mirroring `crates/ui`'s. `mp_engine_qcommon` supplies the
# inbound C-variadic syscall trampoline + `arm_game_slot`; `native_platform`
# the libloading-based module loader; `mp_abi` the import wire numbers.
mp_engine_qcommon = { path = "../mp/engine/qcommon" }
native_platform = { path = "../native/platform" }
mp_abi = { path = "../mp/abi" }
# C6b REPLAY referee (tests/replay_referee.rs): flate2 reads the gzip journal,
# serde_json parses the shape manifests at runtime through the shared shapes.rs.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
