# Virtual workspace — the `jka` monolith (`src/`) has been dissolved into the
# tier crates below. Each Raven module/engine subsystem is its own crate.
[workspace]
resolver = "2"
members = [
    "crates/native/build-date",
    "crates/native/math",
    "crates/native/sort",
    "crates/native/string",
    "crates/native/platform",
    "crates/native/containers",
    "crates/native/types",
    "crates/abi-transport",
    "crates/mp/qshared",
    "crates/mp/bg",
    "crates/mp/uishared",
    "crates/mp/abi",
    "crates/mp/engine-select",
    "crates/mp/host-interface",
    "crates/mp/game",
    "crates/mp/cgame",
    "crates/mp/ui",
    "crates/mp/engine/qcommon",
    "crates/mp/engine/core",
    "crates/mp/engine/server",
    "crates/mp/engine/client",
    "crates/mp/engine/botlib",
    "crates/mp/engine/ghoul2",
    "crates/mp/engine/icarus",
    "crates/mp/engine/rmg",
    "crates/mp/renderer",
    "crates/mp/app",
    "crates/sp/qshared",
    "crates/sp/bg",
    "crates/sp/uishared",
    "crates/sp/abi",
    "crates/sp/game",
    "crates/sp/cgame",
    "crates/sp/ui",
    "crates/sp/engine/qcommon",
    "crates/sp/engine/server",
    "crates/sp/engine/client",
    "crates/sp/engine/ghoul2",
    "crates/sp/engine/icarus",
    "crates/sp/engine/rmg",
    "crates/sp/renderer",
    "crates/sp/app",
    "crates/jampgame",
    "crates/cgame",
    "crates/ui",
    "crates/jagame",
]

# ABI panic policy (2026-07-08): the game-module cdylibs catch panics at their
# `vmMain` choke point and route them through the engine's `Com_Error`/`G_ERROR`
# path (see `crates/jampgame/src/lib.rs`). That firewall REQUIRES unwinding —
# `std::panic::catch_unwind` cannot catch under `panic = "abort"` (the process
# aborts before the catch). This pins the invariant so a future profile edit
# cannot silently switch to abort and turn every panic into a contextless crash.
# Unwinding out of these modules is never actually let escape the boundary
# (`extern "C-unwind"` + catch_unwind at `vmMain`), so this is sound.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"
